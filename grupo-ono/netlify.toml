[build]
  publish = "."

# Fonts and image derivatives are cached for a year. Never overwrite one of these
# files with new content: save it under a new name and update the HTML (see README).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/d/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
